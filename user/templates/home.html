

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'home.css' %}">
</head>
<body>

<div class="card">

    <div class="site-title">HomePage</div>

    <div class="greeting">
        <p>반갑습니다</p>
        <h2>
            안녕하세요,&nbsp;
            <span class="name">{{ user.username|default:"게스트" }}</span> 님
        </h2>
    </div>

    <div class="divider"></div>

    <div class="btn-group">

        {% if user.is_authenticated %}

            <!-- 글 목록 -->
            <a href="{% url 'posts' %}" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h10"/></svg>
                글 목록 보기
            </a>

            <!-- 글 작성 -->
            <a href="{% url 'post_create' %}" class="btn btn-ghost">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                새 글 작성하기
            </a>

            <div class="btn-row">
                <!-- 비밀번호 변경 -->
                <a href="{% url 'password_change' %}" class="btn btn-secondary">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    비밀번호 변경
                </a>

                <!-- 로그아웃 -->
                <form action="{% url 'logout' %}" method="post" style="display:contents">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                        로그아웃
                    </button>
                </form>
            </div>

        {% else %}

            <a href="{% url 'posts' %}" class="btn btn-secondary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h10"/></svg>
                글 목록 보기
            </a>

            <a href="{% url 'login' %}" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                로그인
            </a>

            <a href="{% url 'sign_up' %}" class="btn btn-ghost">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                회원가입
            </a>

        {% endif %}

    </div>

    <p class="footer-note">© 2025 · My Django Project</p>

</div>

</body>
</html>
