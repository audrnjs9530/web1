{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="post-detail">

        <!-- 상단 뒤로가기 -->
        <a href="{% url 'posts' %}" class="back-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            게시글 목록
        </a>

        <!-- 헤더 -->
        <div class="post-detail-header">
            <div class="section-label">Post</div>
            <h2 class="post-detail-title">{{ post.title }}</h2>
            <div class="post-detail-meta">
                <span>{{ post.author }}</span>
                <span>·</span>
                <span>{{ post.created_at|date:"Y.m.d H:i" }}</span>
                <span>·</span>
                <span class="points-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    {{ post.likes }}
                </span>
            </div>
        </div>

        <div class="post-detail-divider"></div>

        <!-- 본문 -->
        <div class="post-detail-body">{{ post.content }}</div>

        <div class="post-detail-divider"></div>

        <!-- 액션 버튼 -->
        <div class="post-actions">
            <form action="{% url 'post_like' post.id %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="btn {% if is_liked %}btn-liked{% else %}btn-ghost{% endif %}">
                    <svg class="icon" viewBox="0 0 24 24"
                        fill="{% if is_liked %}currentColor{% else %}none{% endif %}"
                        stroke="currentColor" stroke-width="2">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    {{ post.points }}
                </button>
            </form>

            <a href="{% url 'posts' %}" class="btn btn-secondary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                목록으로
            </a>
        </div>

    </div>
</div>
{% endblock %}
