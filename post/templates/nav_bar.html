<nav class="navbar">
    <a href="{% url 'home' %}" class="navbar-brand">HackerNews</a>

    <a href="{% url 'posts' %}" class="navbar-link">글 목록</a>

    {% if user.is_authenticated %}
        <a href="{% url 'post_create' %}" class="navbar-link">글 작성</a>

        <div class="navbar-divider"></div>

        <a href="{% url 'password_change' %}" class="navbar-link">
            {{ user.username }}
        </a>

        <form class="navbar-form" action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="navbar-btn-logout">로그아웃</button>
        </form>
    {% else %}
        <div class="navbar-divider"></div>
        <a href="{% url 'login' %}" class="navbar-link">로그인</a>
        <a href="{% url 'sign_up' %}" class="navbar-link">회원가입</a>
    {% endif %}
</nav>
