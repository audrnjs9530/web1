<nav class="navbar">
    <a href="{% url 'boards' %}" class="navbar-brand">롤 평점</a>

    <a href="{% url 'boards' %}" class="navbar-link">글 목록</a>

    {% if user.is_authenticated %}
        <div class="navbar-divider"></div>

        <a href="{% url 'mypage' %}" class="navbar-link navbar-username">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            {{ user.username }}
        </a>

        <form class="navbar-form" action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="navbar-btn-logout">로그아웃</button>
        </form>
    {% else %}
        <div class="navbar-divider"></div>
        <a href="{% url 'login' %}" class="navbar-link">로그인</a>
        <a href="{% url 'sign_up' %}" class="navbar-link">회원가입</a>
    {% endif %}
</nav>
