{% extends 'base.html' %}

{% block title %}새 글 작성{% endblock %}

{% block content %}
<div class="container">
    <div class="post-detail">

        <a href="{% url 'posts' board.id %}" class="back-link">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            게시글 목록
        </a>

        <div class="section-label">New Post</div>
        <h2 class="page-header-title" style="margin-bottom: 2rem;">새로운 게시글 작성</h2>

        <form action="{% url 'post_create' board.id %}" method="post" class="create-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                작성하기
            </button>
        </form>

    </div>
</div>
{% endblock %}
